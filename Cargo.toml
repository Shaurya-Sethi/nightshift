[package]
name = "nightshift-cli"
version = "0.1.1"
edition = "2024"
description = "Let your favourite AI coding agents work the night shift. An agent-agnostic CLI that resolves GitHub issues in dependency order, one clean session per issue."
license = "MIT"
repository = "https://github.com/Shaurya-Sethi/nightshift"
readme = "README.md"
keywords = ["github", "automation", "agent", "cli", "issues"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "nightshift"
path = "src/lib.rs"

[[bin]]
name = "nightshift"
path = "src/main.rs"

[features]
fake-agent = []

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[[bin]]
name = "nightshift-fake-agent"
path = "tests/support/fake_agent.rs"
test = false
required-features = ["fake-agent"]

[[test]]
name = "process_agent_runner"
path = "tests/process_agent_runner.rs"
required-features = ["fake-agent"]
